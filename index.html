<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Grass Horde — Tap & Survive</title>
<style>
html,body{margin:0;height:100%;background:#0b0c10;color:#eaeaea;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#c{width:100vw;height:100vh;touch-action:none;background:#88b26b}
#hud{position:fixed;left:12px;top:10px;background:rgba(0,0,0,.5);padding:8px 10px;border-radius:10px;font-size:14px}
#levelUp{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-weight:700;
padding:8px 12px;border-radius:10px;background:rgba(255,200,40,.9);color:#3c2a00;display:none}
#stick{position:fixed;left:12px;bottom:12px;width:120px;height:120px;opacity:.9;touch-action:none}
#stick .r{position:absolute;inset:0;border-radius:999px;border:2px solid rgba(255,255,255,.35)}
#stick .n{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:999px;
background:rgba(255,255,255,.25)}
#playTip{position:fixed;bottom:10px;right:12px;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">❤️ <span id="hp">100</span> | ⚔️ <span id="kills">0</span> | 🔄 <span id="lvl">1</span></div>
<div id="levelUp">LEVEL UP!</div>
<div id="stick"><div class="r"></div><div class="n" id="nub"></div></div>
<div id="playTip">Drag to move. Survive!</div>

<script>
(() => {
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudHP = document.getElementById('hp');
const hudKills = document.getElementById('kills');
const hudLvl = document.getElementById('lvl');
const levelUpEl = document.getElementById('levelUp');
const stick = document.getElementById('stick');
const nub = document.getElementById('nub');

// Fit canvas to device pixels
const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
function resize() {
canvas.width = Math.floor(innerWidth * DPR);
canvas.height = Math.floor(innerHeight * DPR);
}
addEventListener('resize', resize, {passive:true}); resize();

// World
const W = () => canvas.width;
const H = () => canvas.height;

const rnd = (a,b)=>Math.random()*(b-a)+a;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (a,b)=>Math.hypot(a.x-b.x, a.y-b.y);

const player = {
x: W()/2, y: H()/2, r: 22*DPR, hp:100, speed: 2.4*DPR,
swords: 2, orbitR: 60*DPR, orbitSpeed: 0.0038, angle:0,
invul:0
};

let tick=0, score=0, level=1, xp=0, nextXP=12, over=false;
const enemies=[], sparks=[], drops=[];
let spawnRate = 80; // lower = faster spawns

// Virtual joystick
let joyActive=false, joyCx=stick.offsetLeft+stick.clientWidth/2, joyCy=innerHeight- stick.offsetTop - stick.clientHeight/2;
let joyDx=0, joyDy=0;

function setNub(x,y){
nub.style.transform = `translate(${x}px, ${y}px)`;
}
function joyStart(x,y){ joyActive=true; moveJoy(x,y); }
function joyEnd(){ joyActive=false; joyDx=joyDy=0; setNub(0,0); }
function moveJoy(x,y){
const rect = stick.getBoundingClientRect();
const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
let dx = x-cx, dy = y-cy;
const L = Math.hypot(dx,dy); const max=rect.width*0.36;
if(L>max){ dx*=max/L; dy*=max/L; }
setNub(dx,dy);
joyDx = (dx/max); joyDy = (dy/max);
}

// Touch/Mouse
function p(e){ return e.touches? {x:e.touches[0].clientX, y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY}; }
stick.addEventListener('pointerdown', e=>{stick.setPointerCapture(e.pointerId); joyStart(p(e).x,p(e).y); e.preventDefault();},{passive:false});
stick.addEventListener('pointermove', e=>{ if(joyActive) moveJoy(p(e).x,p(e).y);},{passive:false});
stick.addEventListener('pointerup', e=>{joyEnd();},{passive:true});
// also allow dragging anywhere if user misses the stick
canvas.addEventListener('pointerdown', e=>{ joyStart(p(e).x,p(e).y); }, {passive:true});
canvas.addEventListener('pointermove', e=>{ if(joyActive) moveJoy(p(e).x,p(e).y); }, {passive:true});
canvas.addEventListener('pointerup', e=>{ joyEnd(); }, {passive:true});

// Enemy factory
function spawnEnemy(){
const side = Math.floor(rnd(0,4));
const margin = 40*DPR;
let x,y;
if(side===0){ x=rnd(-margin, W()+margin); y=-margin; }
if(side===1){ x=W()+margin; y=rnd(-margin, H()+margin); }
if(side===2){ x=rnd(-margin, W()+margin); y=H()+margin; }
if(side===3){ x=-margin; y=rnd(-margin, H()+margin); }
enemies.push({x,y, r:18*DPR, spd:rnd(0.6,1.1)*DPR, hp:2, fire:false});
}

// Sword "projectiles" that orbit the player (no separate objects stored)
function drawSword(cx,cy,ang,glow){
const L=36*DPR;
const w=8*DPR;
ctx.save();
ctx.translate(cx,cy);
ctx.rotate(ang);
// glow trail
const grad = ctx.createLinearGradient(-L,0,L,0);
grad.addColorStop(0,'rgba(255,255,255,0)');
grad.addColorStop(0.5,'rgba(140,220,255,.7)');
grad.addColorStop(1,'rgba(255,255,255,0)');
ctx.strokeStyle=grad; ctx.lineWidth=w*0.75; ctx.lineCap='round';
ctx.beginPath(); ctx.moveTo(-L*0.9,0); ctx.lineTo(L*0.9,0); ctx.stroke();
// blade
ctx.strokeStyle='#e8f5ff'; ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(-L,0); ctx.lineTo(L,0); ctx.stroke();
// hilt
ctx.fillStyle='#d1a332'; ctx.fillRect(-L-6*DPR,-w*0.7,10*DPR,w*1.4);
ctx.restore();
}

function addSpark(x,y,c){ sparks.push({x,y,life:18,c}); }
function addDrop(x,y){ drops.push({x,y,r:10*DPR, life:600}); }

function levelUp(){
level++; hudLvl.textContent=level; player.swords=Math.min(6, player.swords+1);
player.orbitR += 4*DPR; spawnRate = Math.max(28, spawnRate-4);
levelUpEl.style.display='block'; setTimeout(()=>levelUpEl.style.display='none', 700);
}

function update(dt){
tick++;

// move player
player.x += player.speed*joyDx*dt;
player.y += player.speed*joyDy*dt;
player.x = clamp(player.x, 30*DPR, W()-30*DPR);
player.y = clamp(player.y, 40*DPR, H()-30*DPR);

// spawn enemies
if(tick % Math.floor(spawnRate/Math.max(1,level*0.2))===0) spawnEnemy();

// move enemies
for(let i=enemies.length-1;i>=0;i--){
const e=enemies[i];
const ang = Math.atan2(player.y-e.y, player.x-e.x);
e.x += Math.cos(ang)*e.spd*dt;
e.y += Math.sin(ang)*e.spd*dt;

// collide with swords
const blades = player.swords;
let hit = false;
for(let k=0;k<blades;k++){
const a = player.angle + (k*(Math.PI*2/blades));
const bx = player.x + Math.cos(a)*player.orbitR;
const by = player.y + Math.sin(a)*player.orbitR;
if(Math.hypot(e.x-bx, e.y-by) < e.r + 18*DPR){
e.hp -= 1;
hit = true;
addSpark(e.x,e.y,'#aef');
}
}
if(hit && Math.random()<0.12) e.fire=true;

// collide with player
if(dist(e,player) < e.r + player.r){
if(player.invul<=0){
player.hp -= 8; player.invul=20;
addSpark(player.x,player.y,'#ff9');
if(player.hp<=0){ over=true; break; }
}
}
if(e.hp<=0){
enemies.splice(i,1);
score++; hudKills.textContent=score;
addDrop(e.x,e.y);
if(++xp >= nextXP){ xp=0; nextXP=Math.floor(nextXP*1.25); levelUp(); }
}
}

// pickups
for(let i=drops.length-1;i>=0;i--){
const d=drops[i];
d.life-=dt;
if(dist(d,player)<player.r+12*DPR){ drops.splice(i,1); xp++; addSpark(d.x,d.y,'#6f6'); continue; }
if(d.life<=0) drops.splice(i,1);
}

// sparks
for(let i=sparks.length-1;i>=0;i--){
const s=sparks[i]; s.life-=dt; if(s.life<=0) sparks.splice(i,1);
}

player.angle += player.orbitSpeed*dt* (1+0.3*level);
player.invul = Math.max(0, player.invul-dt);

hudHP.textContent = Math.max(0, Math.ceil(player.hp));
}

function drawBackground(){
// “Grass” tile noise + dirt clearing around player (like the ad)
const g=ctx.createLinearGradient(0,0,0,H());
g.addColorStop(0,'#7baa58'); g.addColorStop(1,'#6b9c4e');
ctx.fillStyle=g; ctx.fillRect(0,0,W(),H());
// wooden wall at the top
const wallH = 60*DPR;
for(let x=0;x<W();x+=24*DPR){
ctx.fillStyle='#7d4f2a';
ctx.beginPath(); ctx.roundRect(x,0,22*DPR,wallH,8*DPR); ctx.fill();
ctx.fillStyle='#4f2f16';
ctx.fillRect(x+2*DPR, wallH-10*DPR, 18*DPR, 10*DPR);
}
// dirt clearing
ctx.save();
ctx.globalCompositeOperation='destination-out';
ctx.filter='blur(20px)';
ctx.beginPath(); ctx.arc(player.x, player.y, 140*DPR, 0, Math.PI*2); ctx.fill();
ctx.restore();
// path sand color
ctx.globalCompositeOperation='source-over';
ctx.fillStyle='#d0b089';
ctx.beginPath(); ctx.arc(player.x, player.y, 135*DPR, 0, Math.PI*2); ctx.fill();

// grass edge sparkle
ctx.strokeStyle='rgba(200,240,255,.65)';
ctx.lineWidth=3*DPR;
ctx.beginPath();
for(let a=0;a<Math.PI*2; a+=0.08){
const r=136*DPR + Math.sin(tick*0.05+a)*1.5*DPR;
ctx.lineTo(player.x+Math.cos(a)*r, player.y+Math.sin(a)*r);
}
ctx.stroke();
}

function drawPlayer(){
// circle body
ctx.fillStyle = player.invul>0? 'rgba(255,240,140,.95)':'#b8ccff';
ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
// center
ctx.fillStyle='#2a3b7a'; ctx.beginPath(); ctx.arc(player.x,player.y,6*DPR,0,Math.PI*2); ctx.fill();

// orbiting swords
for(let k=0;k<player.swords;k++){
const a = player.angle + (k*(Math.PI*2/player.swords));
const bx = player.x + Math.cos(a)*player.orbitR;
const by = player.y + Math.sin(a)*player.orbitR;
drawSword(bx,by,a+Math.PI/2,true);
}
}

function drawEnemies(){
for(const e of enemies){
// body
const c = e.fire ? '#ff8340' : '#c9c6d1';
ctx.fillStyle=c; ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill();
// belt shimmer
ctx.strokeStyle='#d9b24d'; ctx.lineWidth=4*DPR;
ctx.beginPath(); ctx.arc(e.x,e.y,e.r*0.6,0,Math.PI*2); ctx.stroke();
if(e.fire){
ctx.fillStyle='rgba(255,120,40,.22)'; ctx.beginPath(); ctx.arc(e.x,e.y,e.r+12*DPR,0,Math.PI*2); ctx.fill();
}
}
}

function drawDrops(){
for(const d of drops){
ctx.strokeStyle='rgba(120,220,255,.85)';
ctx.lineWidth=3*DPR;
ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.stroke();
}
}

function drawSparks(){
for(const s of sparks){
ctx.globalAlpha = s.life/18;
ctx.fillStyle=s.c;
ctx.beginPath(); ctx.arc(s.x, s.y, 6*DPR*(2-s.life/18), 0, Math.PI*2); ctx.fill();
ctx.globalAlpha = 1;
}
}

let last=performance.now();
function loop(t){
const dt = Math.min(5, (t-last)); last=t;
if(!over){ update(dt); drawBackground(); drawEnemies(); drawDrops(); drawPlayer(); drawSparks(); }
else{
drawBackground(); drawEnemies(); drawDrops(); drawPlayer(); drawSparks();
ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,W(),H());
ctx.fillStyle='#fff'; ctx.textAlign='center';
ctx.font = `${28*DPR}px system-ui`; ctx.fillText('Game Over', W()/2, H()/2-20*DPR);
ctx.font = `${18*DPR}px system-ui`; ctx.fillText(`Kills: ${score} • Level: ${level}`, W()/2, H()/2+8*DPR);
ctx.fillText('Reload to play again', W()/2, H()/2+34*DPR);
}
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
