<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Roberto Fantasy — Modern 2D (HD Procedural)</title>
<style>
:root{--ui:#e8eef7}
html,body{height:100%;margin:0;background:#14161a;color:var(--ui);font:600 14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial}
#wrap{height:100%;display:flex;flex-direction:column}
#hud{position:fixed;left:16px;top:12px;background:rgba(10,12,15,.6);backdrop-filter:blur(6px);
padding:10px 14px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
#hud b{color:#9ad1ff}
#game{flex:1;display:flex;align-items:center;justify-content:center}
canvas{width:min(1100px,100vw);height:min(700px,100vh);image-rendering:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.hint{position:fixed;right:14px;bottom:10px;opacity:.8}
</style>
</head>
<body>
<div id="wrap">
<div id="hud">Roberto Fantasy — <b>Modern 2D</b> • Move: WASD/Arrows • Dash: Shift • Attack: K • Menu: P</div>
<div id="game"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="hint">© You • No external art — procedural HD</div>
</div>

<script>
/* ========= Core setup ========= */
const cv = document.getElementById('cv'), cx = cv.getContext('2d',{alpha:false});
const DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = Math.round(cv.width * DPR); cv.height = Math.round(cv.height * DPR);

/* ========= Helpers ========= */
const rand = (a=1,b=0)=>Math.random()*(a-b)+b;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

/* Small value noise (fast, no deps) */
function makeNoise(size=256){
const p = new Float32Array(size*size);
for(let i=0;i<p.length;i++) p[i]=Math.random();
const v=(x,y)=>p[((x&255)<<8)|(y&255)];
return (x,y,oct=4)=>{ // fractal brownian
let amp=1, freq=1, sum=0, norm=0;
for(let i=0;i<oct;i++){
const xi = Math.floor(x*freq), yi=Math.floor(y*freq);
const xf = x*freq-xi, yf=y*freq-yi;
// bilinear
const a=v(xi,yi), b=v(xi+1,yi), c=v(xi,yi+1), d=v(xi+1,yi+1);
const u = xf*xf*(3-2*xf), w = yf*yf*(3-2*yf);
const n = lerp(lerp(a,b,u), lerp(c,d,u), w);
sum += n*amp; norm+=amp; amp*=.5; freq*=2;
}
return sum/norm;
};
}
const noise = makeNoise();

/* ========= World (tile map) ========= */
const T = 48; // tile size (px in world units)
const MAP_W = 120, MAP_H = 120; // large world
const map = new Uint8Array(MAP_W*MAP_H);
// 0 = grass, 1 = path, 2 = water, 3 = tree

function at(x,y){ return map[y*MAP_W+x]; }
function set(x,y,v){ map[y*MAP_W+x]=v; }

function genWorld(){
// base grass
for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++) set(x,y,0);
// rivers (noise threshold)
for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
const n = noise(x*0.06,y*0.06,5);
if(n<0.38) set(x,y,2);
}
// paths (simple road grid)
for(let y=8;y<MAP_H;y+=16) for(let x=0;x<MAP_W;x++) if(at(x,y)!==2) set(x,y,1);
for(let x=6;x<MAP_W;x+=18) for(let y=0;y<MAP_H;y++) if(at(x,y)!==2) set(x,y,1);

// trees sprinkled on grass
for(let i=0;i<1400;i++){
const x=(Math.random()*MAP_W)|0, y=(Math.random()*MAP_H)|0;
if(at(x,y)===0 && noise(x*0.2,y*0.2)>0.52) set(x,y,3);
}
}
genWorld();

/* ========= Player ========= */
const player = {
x: MAP_W*T*0.5, y: MAP_H*T*0.5,
vx:0, vy:0, sp: 260, dashMult: 2.4, dash:0, face: 'down', anim:0, hp:100
};
const keys = {};
addEventListener('keydown',e=>{ keys[e.key]=true; });
addEventListener('keyup',e=>{ keys[e.key]=false; });

/* ========= Camera ========= */
const cam = { x: player.x, y: player.y };
function camUpdate(dt){
const ease = 1 - Math.pow(0.001, dt); // exponential smoothing
cam.x = cam.x + (player.x - cam.x)*ease;
cam.y = cam.y + (player.y - cam.y)*ease;
}

/* ========= Procedural materials ========= */
const mat = {
grass(x,y,t){
// multi-layer green with subtle wind
const g = 0.55 + 0.35*noise(x*0.06+Math.sin(t*.3)*.1, y*0.06+Math.cos(t*.2)*.1, 5);
const d = 0.03 * noise(x*.8,y*.8,2);
const r = 25+g*10, gr = 120+g*80, b = 40+g*35;
return `rgb(${r|0},${gr|0},${(b+d*255)|0})`;
},
path(x,y){
const n = noise(x*0.15,y*0.15,3);
const c = 170 + n*40;
return `rgb(${(c)|0},${(c-8)|0},${(c-16)|0})`;
},
water(x,y,t){
const w1 = noise(x*0.08+ t*0.3, y*0.08+ t*0.25, 4);
const w2 = noise(x*0.20- t*0.2, y*0.20+ t*0.22, 3);
const n = (w1*0.7 + w2*0.3);
const c = 130 + n*120;
const b = 200 + n*40;
return `rgb(${(40+n*40)|0},${(c)|0},${(b)|0})`;
}
};

/* Pre-painted tile cache for speed */
const tileCache = new Map();
function paintTile(type, t){
const key = type+'|'+(t|0);
if(tileCache.has(key)) return tileCache.get(key);
const off = new OffscreenCanvas(T, T), ox = off.getContext('2d');
for(let py=0;py<T;py++){
for(let px=0;px<T;px++){
const wx = px/T, wy = py/T;
let c = '#000';
if(type===0) c = mat.grass(wx,wy,t);
if(type===1) c = mat.path(wx,wy);
if(type===2) c = mat.water(wx,wy,t);
ox.fillStyle = c; ox.fillRect(px,py,1,1);
}
}
// add slight vignette / bevel to each tile
const grd = ox.createLinearGradient(0,0,T,T);
grd.addColorStop(0,'rgba(255,255,255,.04)');
grd.addColorStop(1,'rgba(0,0,0,.12)');
ox.fillStyle = grd; ox.fillRect(0,0,T,T);
tileCache.set(key, off);
return off;
}

/* ========= Rendering ========= */
function drawWorld(t){
const w = cv.width, h = cv.height;
// tiles visible in viewport
const startX = Math.floor((cam.x - w/2)/T)-1;
const startY = Math.floor((cam.y - h/2)/T)-1;
const endX = Math.ceil((cam.x + w/2)/T)+1;
const endY = Math.ceil((cam.y + h/2)/T)+1;

for(let y=startY; y<=endY; y++){
if(y<0||y>=MAP_H) continue;
for(let x=startX; x<=endX; x++){
if(x<0||x>=MAP_W) continue;
const type = at(x,y);
const off = paintTile(type, t*60); // time-based for water shimmer
cx.drawImage(off, x*T - cam.x + w/2, y*T - cam.y + h/2);
}
}

// trees (soft round canopy + shadow)
for(let y=startY; y<=endY; y++){
if(y<0||y>=MAP_H) continue;
for(let x=startX; x<=endX; x++){
if(x<0||x>=MAP_W) continue;
if(at(x,y)===3){
const px = x*T - cam.x + w/2 + T/2;
const py = y*T - cam.y + h/2 + T/2;
// shadow
cx.fillStyle='rgba(0,0,0,.25)';
cx.beginPath(); cx.ellipse(px+8,py+12,T*.32,T*.18,0,0,Math.PI*2); cx.fill();
// canopy
const grd = cx.createRadialGradient(px-6,py-10,8, px,py, T*.42);
grd.addColorStop(0,'#77c96a');
grd.addColorStop(1,'#237a2b');
cx.fillStyle=grd;
cx.beginPath(); cx.arc(px,py,T*.38,0,Math.PI*2); cx.fill();
// trunk
cx.strokeStyle='#7a4b2a'; cx.lineWidth=5; cx.lineCap='round';
cx.beginPath(); cx.moveTo(px,py+10); cx.lineTo(px,py+T*.28); cx.stroke();
}
}
}
}

function drawPlayer(dt,t){
const w=cv.width,h=cv.height;
const px = player.x - cam.x + w/2, py = player.y - cam.y + h/2;

// shadow
cx.fillStyle='rgba(0,0,0,.32)';
cx.beginPath(); cx.ellipse(px+8,py+18,18,10,0,0,Math.PI*2); cx.fill();

// body (rounded, shaded)
const body = cx.createLinearGradient(px-12,py-22, px+12,py+26);
body.addColorStop(0,'#58b2ff');
body.addColorStop(1,'#1463c4');
cx.fillStyle=body; cx.beginPath(); cx.roundRect(px-16,py-24,32,44,12); cx.fill();

// head
const head = cx.createRadialGradient(px-4,py-18,4, px,py-8,18);
head.addColorStop(0,'#ffe1c7'); head.addColorStop(1,'#cc9c70');
cx.fillStyle=head; cx.beginPath(); cx.arc(px,py-10,12,0,Math.PI*2); cx.fill();

// simple sword swing indicator when attacking
if(attackTimer>0){
cx.strokeStyle='rgba(255,255,255,.9)'; cx.lineWidth=4;
const ang = Math.sin((1-attackTimer)*Math.PI)*1.2;
const r=36; cx.beginPath();
cx.arc(px,py, r, -0.6+ang, 0.6+ang); cx.stroke();
}
}

/* ========= Movement / collisions ========= */
function tileAtWorld(wx,wy){
const tx = Math.floor(wx/T), ty = Math.floor(wy/T);
if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return 2; // treat out-of-bounds as water
return at(tx,ty);
}
function isBlocked(type){ return type===2 || type===3; }

let attackTimer = 0;
function update(dt){
// input vector
let ix = (keys['a']||keys['ArrowLeft']?-1:0)+(keys['d']||keys['ArrowRight']?1:0);
let iy = (keys['w']||keys['ArrowUp']?-1:0)+(keys['s']||keys['ArrowDown']?1:0);
const len = Math.hypot(ix,iy)||1; ix/=len; iy/=len;

const speed = player.sp * (keys['Shift']?player.dashMult:1);
player.vx = ix*speed; player.vy = iy*speed;

let nx = player.x + player.vx*dt, ny = player.y + player.vy*dt;

// simple collision: prevent entering water/trees
const r = 14;
const check = (x,y)=>{
const t = tileAtWorld(x,y);
return isBlocked(t);
};
if(!check(nx, player.y-r) && !check(nx, player.y+r)) player.x = nx;
if(!check(player.x-r, ny) && !check(player.x+r, ny)) player.y = ny;

// attack
if(keys['k']||keys['K']) attackTimer = 0.22;
attackTimer = Math.max(0, attackTimer - dt);

camUpdate(dt);
}

/* ========= Post FX ========= */
function postFX(){
// vignette
const w=cv.width,h=cv.height;
const g=cx.createRadialGradient(w/2,h/2, h*.35, w/2,h/2, h*.65);
g.addColorStop(0,'rgba(0,0,0,0)');
g.addColorStop(1,'rgba(0,0,0,.55)');
cx.fillStyle=g; cx.fillRect(0,0,w,h);
// subtle scanlines
cx.fillStyle='rgba(255,255,255,.04)';
for(let y=0;y<h;y+=3){ cx.fillRect(0,y,w,1); }
}

/* ========= Main loop ========= */
let last = performance.now()/1000;
function frame(){
const now = performance.now()/1000, dt = Math.min(0.033, now-last); last=now;

update(dt);
drawWorld(now);
drawPlayer(dt, now);
postFX();

requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ========= Mobile touch (simple) ========= */
let touchId=null, tStart=null;
cv.addEventListener('touchstart',e=>{
const t=e.changedTouches[0]; touchId=t.identifier; tStart={x:t.clientX,y:t.clientY};
});
cv.addEventListener('touchmove',e=>{
const t=[...e.changedTouches].find(t=>t.identifier===touchId); if(!t||!tStart) return;
const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y;
keys['a']=dx<-12; keys['d']=dx>12; keys['w']=dy<-12; keys['s']=dy>12;
});
cv.addEventListener('touchend',()=>{ keys['a']=keys['d']=keys['w']=keys['s']=false; touchId=null; });

/* ========= Pause/Menu placeholder ========= */
let paused=false;
addEventListener('keydown',e=>{ if(e.key==='p'||e.key==='P'){ paused=!paused; }});
</script>
</body>
</html>
