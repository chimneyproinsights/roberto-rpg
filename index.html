<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roberto Fantasy — Art + Maps (Single File)</title>
<style>
  html, body { margin:0; padding:0; background:#0b0c10; color:#fff; font-family: system-ui, -apple-system, Arial; }
  #game { display:flex; justify-content:center; align-items:center; height:100vh; }
  .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.55); padding:8px 10px; border-radius:10px; font-size:14px; line-height:1.4; box-shadow:0 0 12px rgba(0,0,0,0.35); }
  .hud .row { display:flex; gap:12px; flex-wrap:wrap; }
  .panel { position:absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); padding:12px 14px; border-radius:10px; min-width: 340px; text-align:center; box-shadow:0 0 16px rgba(0,0,0,0.45); }
  .panel h3 { margin: 4px 0 8px; font-size:16px; }
  .btnbar { margin-top:8px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button { background:#1e88e5; border:none; color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer; }
  button:disabled { background:#666; cursor:not-allowed;}
  .gp { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.55); padding:8px 10px; border-radius:10px; font-size:12px; box-shadow:0 0 12px rgba(0,0,0,0.35); }
  .gp strong { color:#ffd54a; }
  .corner { position:absolute; bottom:10px; right:10px; opacity:0.6; font-size:12px; }
</style>
</head>
<body>
  <div id="game"></div>
  <div class="hud" id="hud">
    <div><strong>Roberto Fantasy — Demo (Art + Maps)</strong></div>
    <div>Move: WASD/Arrows • Attack: J / <em>A</em> • Block: K / <em>B</em> • Dash: L / <em>X</em> • Interact: E / <em>Y</em></div>
    <div>Dev tier cycle: LB/RB/LT or U/I/O</div>
    <div id="stats"></div>
  </div>
  <div class="panel" id="panel" style="display:none;">
    <h3 id="panelTitle"></h3>
    <div id="panelText"></div>
    <div class="btnbar" id="panelBtns"></div>
  </div>
  <div class="gp" id="gp">Gamepad: <strong>None</strong></div>
  <div class="corner">v1.0 single-file</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>

  <script>
  // ---------- Data (inline) ----------
  const TIERS = {
    levels: [
      {level:1, name:'Bronze', color:'#b87333', multiplier:1.0},
      {level:2, name:'Iron', color:'#a1a1a1', multiplier:1.15},
      {level:3, name:'Steel', color:'#9bb0bd', multiplier:1.32},
      {level:4, name:'Mithril', color:'#7ad0ff', multiplier:1.52},
      {level:5, name:'Obsidian', color:'#3b2f36', multiplier:1.75},
      {level:6, name:'Dragonbone', color:'#d9c089', multiplier:2.02},
      {level:7, name:'Gold', color:'#ffd54a', multiplier:2.35},
    ]
  };
  function computeItems(tiers){
    const swords=[], shields=[], armors=[];
    for(const t of tiers.levels){
      const L=t.level, M=t.multiplier, N=t.name;
      const sword_atk = Math.round(6*M + (L-1)*2);
      const shield_def = Math.round(3*M + (L-1)*1.5);
      const armor_atk = Math.round(1*M + (L-1)*0.5);
      const armor_def = Math.round(2*M + (L-1)*1.2);
      swords.push({ level:L, name:\`\${N} Blade\`, attack:sword_atk });
      shields.push({ level:L, name:\`\${N} Shield\`, defense:shield_def });
      armors.push({ level:L, name:\`\${N} Armor\`, attack_bonus:armor_atk, defense_bonus:armor_def });
    }
    return { swords, shields, armors };
  }
  const ITEMS = computeItems(TIERS);
  const PROGRESSION = {
    chapters:[
      {id:'c1', name:'Awakening', goal:'Find the Ancient Spark', unlocks:{maxTier:2}},
      {id:'c2', name:'Forest of Trials', goal:'Defeat the Thornwatcher', unlocks:{maxTier:3}},
      {id:'c3', name:'Sundered Cliffs', goal:'Recover the Sky Sigil', unlocks:{maxTier:4}},
      {id:'c4', name:'Miresong Depths', goal:'Cleanse the Mire Heart', unlocks:{maxTier:5}},
      {id:'c5', name:'Dragonwake Peaks', goal:'Slay the Stormdrake', unlocks:{maxTier:6}},
      {id:'c6', name:'Citadel of Gold', goal:'Defeat the Gilded Warden', unlocks:{maxTier:7}},
    ],
    economy:{ currency:'Shards', base_drop_per_enemy:[1,2], boss_bonus:[30,60] }
  };

  // ---------- Equipment System ----------
  class EquipmentSystem{
    constructor(tiers, items, progression){
      this.tiers=tiers; this.items=items; this.progression=progression;
      this.levels={ sword:1, shield:1, armor:1 }; this.shards=0; this.chapterIndex=0;
      this.load();
    }
    maxAllowedTier(){ const ch=this.progression.chapters[this.chapterIndex]; return ch?.unlocks?.maxTier||1; }
    canUpgrade(slot){ const next=this.levels[slot]+1; return next<=Math.min(7,this.maxAllowedTier()); }
    upgradeCost(slot){ return 10*(this.levels[slot]+1); }
    tryUpgrade(slot){
      if(!this.canUpgrade(slot)) return {ok:false, reason:'Locked by chapter'};
      const cost=this.upgradeCost(slot); if(this.shards<cost) return {ok:false, reason:'Not enough Shards'};
      this.shards-=cost; this.levels[slot]++; this.save(); return {ok:true};
    }
    cycle(slot){ this.levels[slot]=this.levels[slot]%7+1; this.save(); }
    getAttack(){ const s=this.items.swords.find(x=>x.level===this.levels.sword); const a=this.items.armors.find(x=>x.level===this.levels.armor); return Math.round((s?.attack||1)+(a?.attack_bonus||0)); }
    getDefense(){ const sh=this.items.shields.find(x=>x.level===this.levels.shield); const a=this.items.armors.find(x=>x.level===this.levels.armor); return Math.round((sh?.defense||0)+(a?.defense_bonus||0)); }
    getEquippedNames(){
      const sword=this.items.swords.find(x=>x.level===this.levels.sword)?.name||'Sword Lv1';
      const shield=this.items.shields.find(x=>x.level===this.levels.shield)?.name||'Shield Lv1';
      const armor=this.items.armors.find(x=>x.level===this.levels.armor)?.name||'Armor Lv1';
      return {sword,shield,armor};
    }
    addShards(n){ this.shards+=n; this.save(); }
    nextChapter(){ if(this.chapterIndex<this.progression.chapters.length-1){ this.chapterIndex++; this.save(); return true;} return false; }
    save(){ localStorage.setItem('rf_save', JSON.stringify({levels:this.levels, shards:this.shards, chapterIndex:this.chapterIndex})); }
    load(){ try{ const raw=localStorage.getItem('rf_save'); if(!raw) return; const d=JSON.parse(raw); this.levels=d.levels||this.levels; this.shards=d.shards||0; this.chapterIndex=d.chapterIndex||0; }catch(e){} }
    reset(){ localStorage.removeItem('rf_save'); this.levels={sword:1,shield:1,armor:1}; this.shards=0; this.chapterIndex=0; }
  }

  // ---------- Gamepad helper ----------
  const GP={connected:false,index:null,name:'None',axes:[0,0,0,0],buttons:[],
    update(){
      const pads = navigator.getGamepads?navigator.getGamepads():[];
      const gp = (pads && pads[this.index]) || [...pads].find(p=>p);
      if(!gp){ this.connected=false; this.name='None'; return; }
      this.connected=true; this.index=gp.index; this.name=gp.id||'Gamepad';
      this.axes = gp.axes ? gp.axes.slice(0,4) : [0,0,0,0];
      this.buttons = gp.buttons ? gp.buttons.map(b=>b.pressed) : [];
    }
  };
  window.addEventListener('gamepadconnected', e=>{ GP.connected=true; GP.index=e.gamepad.index; GP.name=e.gamepad.id; renderGP(); });
  window.addEventListener('gamepaddisconnected', ()=>{ GP.connected=false; GP.index=null; GP.name='None'; renderGP(); });
  function renderGP(){ document.getElementById('gp').innerHTML='Gamepad: <strong>'+ (GP.connected?GP.name:'None') +'</strong>'; }

  // ---------- Procedural Pixel Art ----------
  function makeTexture(scene, key, w, h, paint){
    const rt = scene.make.renderTexture({width:w,height:h,add:false});
    const ctx = rt.context;
    paint(ctx, w, h);
    rt.saveTexture(key);
    rt.destroy();
  }
  function rand(min,max){ return Math.floor(min + Math.random()*(max-min+1)); }

  // ---------- Scenes ----------
  class BootScene extends Phaser.Scene{
    constructor(){ super('Boot'); }
    preload(){
      // Player (simple pixel hero with visor)
      makeTexture(this, 'player', 28, 28, (ctx,w,h)=>{
        ctx.fillStyle='#1e88e5'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#0d47a1'; ctx.fillRect(2,2,w-4,h-4);
        ctx.fillStyle='#90caf9'; ctx.fillRect(6,8,w-12,6);
        ctx.fillStyle='#263238'; ctx.fillRect(10,18,8,6);
      });
      // Slime enemy
      makeTexture(this, 'slime', 26, 22, (ctx,w,h)=>{
        ctx.fillStyle='#8bc34a'; ctx.fillRect(0,2,w,h-2);
        ctx.fillStyle='#558b2f'; ctx.fillRect(2,4,w-4,h-6);
        ctx.fillStyle='#c5e1a5'; ctx.fillRect(6,6,w-12,6);
      });
      // Boss
      makeTexture(this, 'boss', 42, 42, (ctx,w,h)=>{
        ctx.fillStyle='#ff7043'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#bf360c'; ctx.fillRect(3,3,w-6,h-6);
        ctx.fillStyle='#ffccbc'; ctx.fillRect(10,10,w-20,10);
        ctx.fillStyle='#3e2723'; ctx.fillRect(14,24,w-28,10);
      });
      // Grass tile
      makeTexture(this, 't_grass', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#2e7d32'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<80;i++){ ctx.fillStyle= (i%3? '#388e3c':'#1b5e20'); ctx.fillRect(rand(0,31), rand(0,31), 1, 1); }
      });
      // Path tile
      makeTexture(this, 't_path', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#8d6e63'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<60;i++){ ctx.fillStyle= (i%2? '#6d4c41':'#a1887f'); ctx.fillRect(rand(0,31), rand(0,31), 1, 1); }
      });
      // Water tile
      makeTexture(this, 't_water', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#1565c0'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<80;i++){ ctx.fillStyle= (i%2? '#42a5f5':'#0d47a1'); ctx.fillRect(rand(0,31), rand(0,31), 1, 1); }
      });
      // Tree obstacle
      makeTexture(this, 't_tree', 32, 40, (ctx,w,h)=>{
        ctx.fillStyle='#1b5e20'; ctx.fillRect(0,0,w,28);
        ctx.fillStyle='#2e7d32'; ctx.fillRect(2,2,w-4,24);
        ctx.fillStyle='#4e342e'; ctx.fillRect(12,28,8,12);
      });
      // Wall (dungeon)
      makeTexture(this, 't_wall', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#37474f'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<60;i++){ ctx.fillStyle=(i%2?'#263238':'#455a64'); ctx.fillRect(rand(0,31), rand(0,31),1,1); }
      });
      // Floor (dungeon)
      makeTexture(this, 't_floor', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#616161'; ctx.fillRect(0,0,w,h);
        for(let i=0;i<50;i++){ ctx.fillStyle=(i%2?'#757575':'#424242'); ctx.fillRect(rand(0,31), rand(0,31),1,1); }
      });
      // Portal / door
      makeTexture(this, 't_portal', 32, 32, (ctx,w,h)=>{
        ctx.fillStyle='#6a1b9a'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#ab47bc'; ctx.fillRect(4,4,w-8,h-8);
      });
      // Forge
      makeTexture(this, 'forge', 36, 36, (ctx,w,h)=>{
        ctx.fillStyle='#f57c00'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#ffb74d'; ctx.fillRect(6,6,w-12,h-12);
      });
      // NPC
      makeTexture(this, 'npc', 28, 28, (ctx,w,h)=>{
        ctx.fillStyle='#7e57c2'; ctx.fillRect(0,0,w,h);
        ctx.fillStyle='#b39ddb'; ctx.fillRect(4,6,w-8,8);
      });
    }
    create(){ this.scene.start('World', { mapId:'overworld', spawn:{x:160,y:320} }); }
  }

  // ---------- Maps ----------
  // 0 empty/grass, 1 path/floor, 2 water, 3 tree, 4 portal, 5 wall, 6 dungeon floor
  const MAPS = {
    overworld: {
      tile: 32, cols: 30, rows: 18,
      data: (function(){
        const rows=18, cols=30, t=[];
        for(let y=0;y<rows;y++){ const row=[]; for(let x=0;x<cols;x++){ row.push(0);} t.push(row); }
        // lake
        for(let y=4;y<9;y++){ for(let x=18;x<27;x++){ t[y][x]=2; } }
        // path
        for(let x=4;x<26;x++){ t[10][x]=1; }
        for(let y=6;y<14;y++){ t[y][8]=1; }
        // trees border
        for(let x=0;x<30;x++){ t[0][x]=3; t[17][x]=3; }
        for(let y=0;y<18;y++){ t[y][0]=3; t[y][29]=3; }
        // portals
        t[10][25]=4; // to dungeon entrance
        return t;
      })(),
      portals:[ {x:25,y:10,to:'dungeon',toPos:{x:64,y:64}} ],
      forge:{x:6*32+16,y:10*32+16},
      npc:{x:12*32+16,y:10*32+16},
      enemies:[ {x:20*32+16,y:8*32+16}, {x:23*32+16,y:12*32+16} ]
    },
    dungeon: {
      tile:32, cols:22, rows:14,
      data:(function(){
        const r=14, c=22, t=[];
        for(let y=0;y<r;y++){ const row=[]; for(let x=0;x<c;x++){ row.push(6);} t.push(row); }
        // walls ring
        for(let x=0;x<c;x++){ t[0][x]=5; t[r-1][x]=5; }
        for(let y=0;y<r;y++){ t[y][0]=5; t[y][c-1]=5; }
        // inner walls
        for(let x=2;x<20;x++){ t[4][x]=5; }
        for(let y=6;y<12;y++){ t[y][10]=5; }
        // portal to boss
        t[12][20]=4;
        // portal back to overworld
        t[1][1]=4;
        return t;
      })(),
      portals:[
        {x:20,y:12,to:'boss',toPos:{x:320,y:240}},
        {x:1,y:1,to:'overworld',toPos:{x:25*32+16,y:10*32+16}}
      ],
      forge:null, npc:null,
      enemies:[ {x:8*32+16,y:8*32+16}, {x:15*32+16,y:3*32+16}, {x:6*32+16,y:11*32+16} ]
    },
    boss: {
      tile:32, cols:20, rows:14,
      data:(function(){
        const r=14,c=20,t=[];
        for(let y=0;y<r;y++){ const row=[]; for(let x=0;x<c;x++){ row.push(6);} t.push(row); }
        for(let x=0;x<c;x++){ t[0][x]=5; t[r-1][x]=5; }
        for(let y=0;y<r;y++){ t[y][0]=5; t[y][c-1]=5; }
        // center motif
        for(let y=6;y<=7;y++){ for(let x=8;x<=11;x++){ t[y][x]=1; } }
        // portal back
        t[12][2]=4;
        return t;
      })(),
      portals:[ {x:2,y:12,to:'dungeon',toPos:{x:64,y:64}} ],
      forge:null, npc:null,
      enemies:[]
    }
  };

  function tileKey(code){
    switch(code){
      case 0: return 't_grass';
      case 1: return 't_path';
      case 2: return 't_water';
      case 3: return 't_tree';
      case 4: return 't_portal';
      case 5: return 't_wall';
      case 6: return 't_floor';
      default: return 't_grass';
    }
  }
  function isSolid(code){
    return (code===2 || code===3 || code===5); // water/tree/wall are solid
  }

  class WorldScene extends Phaser.Scene{
    constructor(){ super('World'); }
    init(data){ this.mapId=data.mapId||'overworld'; this.spawn=data.spawn||{x:160,y:320}; }
    create(){
      this.equipment = new EquipmentSystem(TIERS, ITEMS, PROGRESSION);
      this.hp=100; this.maxHp=100; this.invuln=0; this.blocking=false;
      this.statsEl=document.getElementById('stats');
      this.panel=document.getElementById('panel');
      this.panelTitle=document.getElementById('panelTitle');
      this.panelText=document.getElementById('panelText');
      this.panelBtns=document.getElementById('panelBtns');

      this.cursors=this.input.keyboard.createCursorKeys();
      this.keys=this.input.keyboard.addKeys('W,A,S,D,J,K,L,U,I,O,E');

      this.loadMap(this.mapId);

      this.player=this.physics.add.image(this.spawn.x, this.spawn.y, 'player').setDepth(10);
      this.player.setCollideWorldBounds(true); this.player.speed=180;

      this.cameras.main.setBounds(0,0,this.worldW,this.worldH);
      this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

      // enemies group
      this.enemiesGroup = this.physics.add.group();
      for(const e of this.mapDef.enemies||[]){
        const mob=this.physics.add.image(e.x, e.y, 'slime'); mob.hp=35; mob.setDepth(9);
        this.enemiesGroup.add(mob);
      }
      // boss
      if(this.mapId==='boss'){
        this.boss=this.physics.add.image(this.worldW/2, this.worldH/2, 'boss'); this.boss.hp=220;
        this.boss.setDepth(9);
      }

      // solid tile bodies
      this.solidBodies=this.physics.add.staticGroup();
      for(let y=0;y<this.rows;y++){
        for(let x=0;x<this.cols;x++){
          if(isSolid(this.map[y][x])){
            const b=this.solidBodies.create(x*this.tile + this.tile/2, y*this.tile + this.tile/2, null);
            b.body.setSize(this.tile, this.tile);
            b.setVisible(false);
          }
        }
      }
      this.physics.add.collider(this.player, this.solidBodies);

      // interactives
      if(this.mapDef.forge){
        this.forge=this.physics.add.staticImage(this.mapDef.forge.x, this.mapDef.forge.y, 'forge').setDepth(9);
        this.physics.add.collider(this.player, this.forge);
      }
      if(this.mapDef.npc){
        this.npc=this.physics.add.staticImage(this.mapDef.npc.x, this.mapDef.npc.y, 'npc').setDepth(9);
        this.physics.add.collider(this.player, this.npc);
      }

      // overlaps with enemies
      this.physics.add.overlap(this.player, this.enemiesGroup, ()=>{
        if(!this.blocking){ const dmg=Math.max(1, 8 - this.equipment.getDefense()); this.takeDamage(dmg); }
      });
      // boss overlap
      if(this.boss){
        this.physics.add.overlap(this.player, this.boss, ()=>{
          if(!this.blocking){ const dmg=Math.max(1, 14 - this.equipment.getDefense()); this.takeDamage(dmg); }
        });
      }

      this.updateHUD();
    }

    loadMap(mapId){
      this.mapId=mapId;
      this.mapDef=MAPS[mapId];
      this.tile=this.mapDef.tile; this.cols=this.mapDef.cols; this.rows=this.mapDef.rows;
      this.map=this.mapDef.data;
      this.worldW=this.cols*this.tile; this.worldH=this.rows*this.tile;

      // render tiles
      this.add.rectangle(this.worldW/2, this.worldH/2, this.worldW, this.worldH, 0x0e1116).setDepth(0);
      for(let y=0;y<this.rows;y++){
        for(let x=0;x<this.cols;x++){
          const code=this.map[y][x];
          const key=tileKey(code);
          this.add.image(x*this.tile, y*this.tile, key).setOrigin(0).setDepth(1);
        }
      }
      // portals dictionary
      this.portals = {};
      for(const p of this.mapDef.portals||[]){
        this.portals[p.y+','+p.x] = p;
      }
    }

    openPanel(title, text, buttons){
      this.panelTitle.innerText=title;
      this.panelText.innerText=text;
      this.panelBtns.innerHTML='';
      for(const b of buttons){
        const el=document.createElement('button');
        el.innerText=b.label; el.disabled=!!b.disabled;
        el.onclick=()=>{ this.closePanel(); b.onClick && b.onClick(); };
        this.panelBtns.appendChild(el);
      }
      this.panel.style.display='block';
    }
    closePanel(){ this.panel.style.display='none'; }

    gotoMap(id, spawn){
      this.scene.restart({ mapId:id, spawn });
    }

    update(_, dt){
      GP.update(); renderGP();
      const delta=dt/1000; this.invuln=Math.max(0, this.invuln - delta);

      // movement
      let vx=0, vy=0;
      if(this.cursors.left.isDown || this.keys.A.isDown) vx=-1;
      else if(this.cursors.right.isDown || this.keys.D.isDown) vx=1;
      if(this.cursors.up.isDown || this.keys.W.isDown) vy=-1;
      else if(this.cursors.down.isDown || this.keys.S.isDown) vy=1;
      if(GP.connected){
        const ax=GP.axes[0]||0, ay=GP.axes[1]||0;
        if(Math.abs(ax)>0.25) vx=ax;
        if(Math.abs(ay)>0.25) vy=ay;
        if(GP.buttons[14]) vx=-1; if(GP.buttons[15]) vx=1;
        if(GP.buttons[12]) vy=-1; if(GP.buttons[13]) vy=1;
      }
      const len=Math.hypot(vx,vy)||1;
      this.player.setVelocity((vx/len)*this.player.speed, (vy/len)*this.player.speed);

      // actions
      const justJ=Phaser.Input.Keyboard.JustDown(this.keys.J);
      const justL=Phaser.Input.Keyboard.JustDown(this.keys.L);
      const justE=Phaser.Input.Keyboard.JustDown(this.keys.E);
      this.blocking=this.keys.K.isDown || (GP.connected && GP.buttons[1]);

      const atkBtn = GP.connected && GP.buttons[0];
      const dashBtn = GP.connected && GP.buttons[2];
      const interactBtn = GP.connected && GP.buttons[3];

      if(justJ || atkBtn){
        const damage=this.equipment.getAttack();
        // mobs
        this.enemiesGroup.children.iterate(m=>{
          if(m && m.active && Phaser.Math.Distance.BetweenPoints(this.player, m)<46){
            m.hp -= damage;
            if(m.hp<=0){ this.dropShards(Phaser.Math.Between(2,5)); m.destroy(); this.updateHUD(); }
          }
        });
        // boss
        if(this.boss && this.boss.active && Phaser.Math.Distance.BetweenPoints(this.player, this.boss)<56){
          this.boss.hp -= damage;
          if(this.boss.hp<=0){
            this.dropShards(Phaser.Math.Between(40,70));
            this.boss.destroy();
            this.equipment.nextChapter();
            this.updateHUD();
            this.openPanel('Victory!', 'The Gilded Warden falls. Your legend grows.', [
              {label:'Back to Dungeon', onClick:()=> this.gotoMap('dungeon', {x:64,y:64})}
            ]);
          }
        }
      }

      if(justL || dashBtn){
        const v=this.player.body.velocity; const mag=Math.hypot(v.x,v.y)||1;
        this.player.x += (v.x/mag)*52; this.player.y += (v.y/mag)*52;
      }

      if(justE || interactBtn){
        if(this.forge && Phaser.Math.Distance.BetweenPoints(this.player, this.forge)<60){ this.openForge(); }
        else if(this.npc && Phaser.Math.Distance.BetweenPoints(this.player, this.npc)<60){ this.openNPC(); }
        else {
          // check portal underfoot
          const tx = Math.floor(this.player.x/this.tile);
          const ty = Math.floor(this.player.y/this.tile);
          const key = ty+','+tx;
          if(this.portals[key]){
            const p=this.portals[key];
            this.gotoMap(p.to, p.toPos);
          }
        }
      }

      // dev tier cycle
      if(Phaser.Input.Keyboard.JustDown(this.keys.U) || (GP.connected && GP.buttons[4])){ this.equipment.cycle('sword'); this.updateHUD(); }
      if(Phaser.Input.Keyboard.JustDown(this.keys.I) || (GP.connected && GP.buttons[5])){ this.equipment.cycle('shield'); this.updateHUD(); }
      if(Phaser.Input.Keyboard.JustDown(this.keys.O) || (GP.connected && (GP.buttons[6]||GP.buttons[7]))){ this.equipment.cycle('armor'); this.updateHUD(); }

      // simple enemy AI
      this.enemiesGroup.children.iterate(m=>{
        if(!m || !m.active) return;
        const ang=Phaser.Math.Angle.Between(m.x,m.y,this.player.x,this.player.y);
        m.setVelocity(Math.cos(ang)*60, Math.sin(ang)*60);
      });

      // boss AI: slow chase + bursts
      if(this.boss && this.boss.active){
        if(!this.boss.cool) this.boss.cool=0;
        this.boss.cool -= delta;
        const ang=Phaser.Math.Angle.Between(this.boss.x,this.boss.y,this.player.x,this.player.y);
        const speed=(this.boss.cool>0)?200:80;
        this.boss.setVelocity(Math.cos(ang)*speed, Math.sin(ang)*speed);
        if(this.boss.cool<=0 && Phaser.Math.Distance.BetweenPoints(this.boss, this.player)<180){
          this.boss.cool=2.5; // burst cooldown
        }
      }
    }

    dropShards(n){ this.equipment.addShards(n); }
    openForge(){
      const canW=this.equipment.canUpgrade('sword'), canS=this.equipment.canUpgrade('shield'), canA=this.equipment.canUpgrade('armor');
      const cw=this.equipment.upgradeCost('sword'), cs=this.equipment.upgradeCost('shield'), ca=this.equipment.upgradeCost('armor');
      this.openPanel('Forge', 'Spend Shards to upgrade gear (capped by your current chapter).', [
        {label:\`Upgrade Sword (\${cw})\`, disabled:!canW || this.equipment.shards<cw, onClick:()=>{ this.equipment.tryUpgrade('sword'); this.updateHUD(); }},
        {label:\`Upgrade Shield (\${cs})\`, disabled:!canS || this.equipment.shards<cs, onClick:()=>{ this.equipment.tryUpgrade('shield'); this.updateHUD(); }},
        {label:\`Upgrade Armor (\${ca})\`, disabled:!canA || this.equipment.shards<ca, onClick:()=>{ this.equipment.tryUpgrade('armor'); this.updateHUD(); }},
        {label:'Close', onClick:()=>{} }
      ]);
    }
    openNPC(){
      const ch=this.equipment.progression.chapters[this.equipment.chapterIndex];
      const more=(this.equipment.chapterIndex < this.equipment.progression.chapters.length-1);
      this.openPanel('Traveler', \`"\${ch.name}" — Goal: \${ch.goal}\`, [
        {label: more ? 'Mark Chapter Complete' : 'You are the Champion!', disabled:!more, onClick:()=>{ this.equipment.nextChapter(); this.updateHUD(); }},
        {label:'Reset Save', onClick:()=>{ this.equipment.reset(); this.updateHUD(); }},
        {label:'Close', onClick:()=>{} }
      ]);
    }

    takeDamage(amount){
      if(this.invuln>0) return;
      this.hp=Math.max(0, this.hp - amount); this.invuln=0.5;
      this.player.setTint(0xff7777); this.time.delayedCall(120, ()=>this.player.clearTint());
      this.updateHUD();
    }

    updateHUD(){
      const gear=this.equipment.getEquippedNames();
      const stats={ attack:this.equipment.getAttack(), defense:this.equipment.getDefense(), hp:\`\${this.hp}/\${this.maxHp}\`, shards:this.equipment.shards, cap:this.equipment.maxAllowedTier() };
      const ch=this.equipment.progression.chapters[this.equipment.chapterIndex];
      this.statsEl.innerHTML = `
        <div class="row">
          <div>Weapon: <strong>${gear.sword}</strong></div>
          <div>Shield: <strong>${gear.shield}</strong></div>
          <div>Armor: <strong>${gear.armor}</strong></div>
        </div>
        <div class="row">
          <div>ATK: <strong>${stats.attack}</strong></div>
          <div>DEF: <strong>${stats.defense}</strong></div>
          <div>HP: <strong>${stats.hp}</strong></div>
          <div>Shards: <strong>${stats.shards}</strong></div>
          <div>Tier Cap: <strong>${stats.cap}</strong></div>
        </div>
        <div class="row">
          <div>Chapter: <strong>${ch.name}</strong> — Goal: <strong>${ch.goal}</strong></div>
          <div>Map: <strong>${this.mapId}</strong></div>
        </div>`;
    }
  }

  const config={ type:Phaser.AUTO, width:960, height:540, parent:'game', backgroundColor:'#0d1117',
    physics:{ default:'arcade', arcade:{ gravity:{y:0}, debug:false } },
    scene:[BootScene, WorldScene]
  };
  new Phaser.Game(config);
  </script>
</body>
</html>
